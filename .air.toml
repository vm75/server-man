root = "."
tmp_dir = ".cache/air"
env_files = []

[build]
cmd = "go build -o ./.cache/air/server-man ./cmd/server-man"
entrypoint = ["./.cache/air/server-man"]
include_dir = ["cmd/server-man", "internal"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum"]
exclude_dir = [".cache", ".git", ".server-man", "bin", "dist", "web", "tools", "internal/webui/assets/dist"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "10s"

[log]
time = true

[misc]
clean_on_exit = true
