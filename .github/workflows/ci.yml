name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/mcp/package-lock.json
            tools/ui/package-lock.json
      - name: Install native share validator
        run: sudo apt-get update && sudo apt-get install -y samba-common-bin
      - name: Install dependencies
        run: make setup
      - name: Install browser engines
        run: npm --prefix tools/ui exec -- playwright install --with-deps firefox
      - name: Verify
        run: make check test mcp-test ui-test
      - name: Verify staged install
        run: |
          make install DESTDIR="$RUNNER_TEMP/server-man-stage"
          test -x "$RUNNER_TEMP/server-man-stage/usr/local/bin/server-man"
          "$RUNNER_TEMP/server-man-stage/usr/local/bin/server-man" -version
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-man-browser-verification
          path: tools/ui/artifacts/
          if-no-files-found: ignore
